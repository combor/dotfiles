set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -g focus-events on
set -g mouse on

# Forward modified keys (shift+enter, ctrl+enter, ...) to apps that ask for them
set -s extended-keys on
set -as terminal-features ",*:extkeys"
set -sg escape-time 10
set -g history-limit 50000

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-interval 5
set -g status-style "bg=default,fg=colour245"

set -g status-left "#[fg=colour231,bg=colour31,bold] #S #[default] "
set -g status-left-length 20

set -g automatic-rename on
set -g automatic-rename-format "#{?#{m:[0-9]*.[0-9]*.[0-9]*,#{pane_current_command}},claude,#{pane_current_command}}"

set -g window-status-format         "#[fg=colour245]#I:#W#F"
set -g window-status-current-format "#[fg=colour255,bold]#I:#W#F"
set -g window-status-separator " "

set -g status-right "#[fg=colour240]#{=40:pane_title} #[fg=colour250]%H:%M "
set -g status-right-length 60

set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour31"
set -g message-style "bg=colour31,fg=colour231"
